[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rules-and-purpose-lab"
version = "0.1.0"
description = "An applied lab for contracts, AI evaluation, and release evidence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools]
packages = ["rules_purpose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
